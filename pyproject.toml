[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "RealtimeSTT",
    "RealtimeTTS",
    "RealtimeTTS[kokoro]",
    "faster-whisper",
    "cartesia",
    "pyaudio",
    "sounddevice",
    "numpy",
    "psutil",
    "torch",
    "python-dotenv",
]

[project.scripts]
friday = "server:main"
friday_voice = "agent_friday:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
